name: Validate skills

on:
  # Run on every PR into main so the 'validate' status check always reports.
  # Branch protection requires the check, and a path-filter-skipped workflow
  # leaves the status pending forever (blocks merge). The workflow itself is
  # cheap — yq + a few greps — so running on every PR is fine.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/validate-skills.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate every SKILL.md
        run: |
          set -e
          fail=0
          for f in skills/*/SKILL.md; do
            echo "::group::Validating $f"

            # Extract YAML frontmatter (between the first two --- lines)
            fm=$(awk '/^---$/{c++; if(c==2) exit; next} c==1' "$f")
            if [ -z "$fm" ]; then
              echo "::error file=$f::Missing YAML frontmatter"
              fail=1
              echo "::endgroup::"
              continue
            fi

            name=$(echo "$fm" | yq -r '.name // ""')
            description=$(echo "$fm" | yq -r '.description // ""')

            # Required fields
            if [ -z "$name" ]; then
              echo "::error file=$f::frontmatter missing required 'name'"
              fail=1
            fi
            if [ -z "$description" ]; then
              echo "::error file=$f::frontmatter missing required 'description'"
              fail=1
            fi

            # name constraints
            if [ ${#name} -gt 64 ]; then
              echo "::error file=$f::'name' exceeds 64 characters (${#name})"
              fail=1
            fi
            if ! echo "$name" | grep -qE '^[a-z0-9-]+$'; then
              echo "::error file=$f::'name' must be lowercase letters / digits / hyphens only (got: $name)"
              fail=1
            fi
            if echo "$name" | grep -qiE 'anthropic|claude'; then
              echo "::error file=$f::'name' contains reserved word (anthropic/claude)"
              fail=1
            fi

            # description ≤ 200 chars (claude.ai limit; API allows 1024 but we target the strictest)
            if [ ${#description} -gt 200 ]; then
              echo "::error file=$f::'description' exceeds 200 characters (${#description})"
              fail=1
            fi

            # Directory name must match frontmatter name
            dir=$(basename "$(dirname "$f")")
            if [ "$dir" != "$name" ]; then
              echo "::error file=$f::directory name '$dir' must match frontmatter name '$name'"
              fail=1
            fi

            echo "OK: name=$name, description length=${#description}"
            echo "::endgroup::"
          done
          exit $fail

      - name: Validate plugin manifests
        run: |
          set -e
          fail=0
          version=$(tr -d '[:space:]' < VERSION)

          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::not valid JSON"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

          # The repo is its own single plugin: the marketplace entry's source is
          # the repo root, so plugin.json and marketplace.json must agree with
          # each other and with VERSION, or installs pin a stale release.
          plugin_name=$(jq -r '.name' .claude-plugin/plugin.json)
          entry_name=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          if [ "$plugin_name" != "$entry_name" ]; then
            echo "::error::plugin.json name '$plugin_name' != marketplace entry name '$entry_name'"
            fail=1
          fi

          for pair in "plugin.json:$(jq -r '.version' .claude-plugin/plugin.json)" \
                      "marketplace.json:$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"; do
            file=${pair%%:*}
            got=${pair#*:}
            if [ "$got" != "$version" ]; then
              echo "::error::$file version '$got' does not match VERSION '$version' — bump both in the same PR"
              fail=1
            fi
          done

          # Every skill directory must sit where the plugin loader looks for it.
          for dir in skills/*/; do
            [ -f "${dir}SKILL.md" ] || { echo "::error::${dir} has no SKILL.md"; fail=1; }
          done

          [ $fail -eq 0 ] && echo "OK: manifests agree, version $version"
          exit $fail
