name: Validate skills

on:
  # Run on every PR into main so the 'validate' status check always reports.
  # Branch protection requires the check, and a path-filter-skipped workflow
  # leaves the status pending forever (blocks merge). The workflow itself is
  # cheap — yq + a few greps — so running on every PR is fine.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - 'VERSION'
      - '.github/workflows/validate-skills.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned and checksum-verified. The previous `latest` URL meant every run
      # executed whatever upstream had published most recently, unverified.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.6
          YQ_SHA256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
        run: |
          wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Validate every SKILL.md
        run: |
          set -e
          fail=0
          for f in skills/*/SKILL.md; do
            echo "::group::Validating $f"

            # Extract YAML frontmatter (between the first two --- lines)
            fm=$(awk '/^---$/{c++; if(c==2) exit; next} c==1' "$f")
            if [ -z "$fm" ]; then
              echo "::error file=$f::Missing YAML frontmatter"
              fail=1
              echo "::endgroup::"
              continue
            fi

            name=$(echo "$fm" | yq -r '.name // ""')
            description=$(echo "$fm" | yq -r '.description // ""')

            # Required fields
            if [ -z "$name" ]; then
              echo "::error file=$f::frontmatter missing required 'name'"
              fail=1
            fi
            if [ -z "$description" ]; then
              echo "::error file=$f::frontmatter missing required 'description'"
              fail=1
            fi

            # name constraints
            if [ ${#name} -gt 64 ]; then
              echo "::error file=$f::'name' exceeds 64 characters (${#name})"
              fail=1
            fi
            if ! echo "$name" | grep -qE '^[a-z0-9-]+$'; then
              echo "::error file=$f::'name' must be lowercase letters / digits / hyphens only (got: $name)"
              fail=1
            fi
            if echo "$name" | grep -qiE 'anthropic|claude'; then
              echo "::error file=$f::'name' contains reserved word (anthropic/claude)"
              fail=1
            fi

            # description ≤ 200 chars (claude.ai limit; API allows 1024 but we target the strictest)
            if [ ${#description} -gt 200 ]; then
              echo "::error file=$f::'description' exceeds 200 characters (${#description})"
              fail=1
            fi

            # Directory name must match frontmatter name
            dir=$(basename "$(dirname "$f")")
            if [ "$dir" != "$name" ]; then
              echo "::error file=$f::directory name '$dir' must match frontmatter name '$name'"
              fail=1
            fi

            echo "OK: name=$name, description length=${#description}"
            echo "::endgroup::"
          done
          exit $fail

      - name: Validate plugin manifests
        run: |
          set -e
          fail=0
          version=$(tr -d '[:space:]' < VERSION)
          mp=.claude-plugin/marketplace.json
          pl=.claude-plugin/plugin.json

          for f in "$mp" "$pl"; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::not valid JSON"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

          # jq empty proves the file parses and nothing more. These assert the
          # fields an install actually consumes, so a manifest that drops one
          # fails here rather than in a customer's client.
          [ -n "$(jq -r '.name // ""' "$mp")" ] || { echo "::error file=$mp::missing 'name'"; fail=1; }
          [ -n "$(jq -r '.owner.name // ""' "$mp")" ] || { echo "::error file=$mp::missing 'owner.name'"; fail=1; }
          [ "$(jq '.plugins | length' "$mp")" -ge 1 ] || { echo "::error file=$mp::lists no plugins"; fail=1; }
          incomplete=$(jq '[.plugins[] | select((.name // "") == "" or .source == null or (.version // "") == "")] | length' "$mp")
          [ "$incomplete" -eq 0 ] || { echo "::error file=$mp::$incomplete plugin entries miss name, source or version"; fail=1; }
          [ -n "$(jq -r '.name // ""' "$pl")" ] || { echo "::error file=$pl::missing 'name'"; fail=1; }

          # The repo is its own single plugin: the marketplace entry's source is
          # the repo root, so plugin.json and marketplace.json must agree with
          # each other and with VERSION, or installs pin a stale release.
          plugin_name=$(jq -r '.name' "$pl")
          entry_name=$(jq -r '.plugins[0].name' "$mp")
          if [ "$plugin_name" != "$entry_name" ]; then
            echo "::error::plugin.json name '$plugin_name' != marketplace entry name '$entry_name'"
            fail=1
          fi

          entry_source=$(jq -r '.plugins[0].source' "$mp")
          if [ "$entry_source" != "./" ]; then
            echo "::error file=$mp::plugin source is '$entry_source'; this repo publishes itself, so it must be './'"
            fail=1
          fi

          for pair in "plugin.json:$(jq -r '.version' "$pl")" \
                      "marketplace.json:$(jq -r '.plugins[0].version' "$mp")"; do
            file=${pair%%:*}
            got=${pair#*:}
            if [ "$got" != "$version" ]; then
              echo "::error::$file version '$got' does not match VERSION '$version' — bump both in the same PR"
              fail=1
            fi
          done

          # Every skill directory must sit where the plugin loader looks for it.
          for dir in skills/*/; do
            [ -f "${dir}SKILL.md" ] || { echo "::error::${dir} has no SKILL.md"; fail=1; }
          done

          [ $fail -eq 0 ] && echo "OK: manifests agree, version $version"
          exit $fail
