name: Release on VERSION bump

# Auto-tag and auto-release whenever the top-level VERSION file changes on main.
# The workflow imports a GPG signing key (so the tag is signed, matching the
# CONTRIBUTING.md signed-commit policy) and attaches per-skill zip artifacts to
# the GitHub release for claude.ai users who can't install skills from a git URL.

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag + release if VERSION bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag lookup)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::VERSION '$VERSION' is not valid SemVer"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"

      - name: Skip if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing GPG key
        if: steps.tag_check.outputs.skip == 'false'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Create and push signed tag
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GIT_AUTHOR_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import_gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import_gpg.outputs.email }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✓ Pushed signed tag $TAG"

      # Pinned and checksum-verified, same as the validate workflow.
      - name: Install yq
        if: steps.tag_check.outputs.skip == 'false'
        env:
          YQ_VERSION: v4.53.6
          YQ_SHA256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
        run: |
          wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Build per-skill zip artifacts
        if: steps.tag_check.outputs.skip == 'false'
        id: zips
        run: |
          mkdir -p /tmp/skill-zips
          VERSION="${{ steps.version.outputs.version }}"
          for dir in skills/*/; do
            name=$(basename "$dir")
            # Each zip is named for the SKILL's own version, not the repo's, so
            # a downloaded file says what it holds. validate-skills.yaml is what
            # guarantees the field is there and is SemVer.
            fm=$(awk '/^---$/{c++; if(c==2) exit; next} c==1' "${dir}SKILL.md")
            skill_version=$(echo "$fm" | yq -r '.metadata.version // ""')
            if [ -z "$skill_version" ]; then
              echo "::error::${name} has no metadata.version; falling back to repo VERSION $VERSION"
              skill_version="$VERSION"
            fi
            ( cd skills && zip -r "/tmp/skill-zips/${name}-v${skill_version}.zip" "$name" -x '*.DS_Store' )
            echo "✓ Built ${name}-v${skill_version}.zip"
          done
          ls -la /tmp/skill-zips

      - name: Create GitHub release with skill zips
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            /tmp/skill-zips/*.zip
          echo "✓ Created release $TAG"
